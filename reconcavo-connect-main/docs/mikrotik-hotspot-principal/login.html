<!-- ============================================================================
     Tela de login do hotspot — Recôncavo Voucher (LOCAL: Principal)
     Substitui flash/hotspot/login.html no MikroTik DESTE local (Winbox → Files).
     Requer login-by=http-pap no profile do hotspot, e o site + Supabase +
     AbacatePay liberados no Walled Garden.

     Diferença multi-local: redireciona para a loja JÁ com ?loja=principal,
     para o cliente cair direto nos planos/preços deste ponto (sem passar pelo
     seletor de local). O formulário abaixo é só um FALLBACK, caso o site esteja
     indisponível — ainda autentica localmente no MikroTik via http-pap.
     Mantém as variáveis do MikroTik: $(link-login-only), $(link-orig), $(error).
============================================================================ -->
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Recôncavo Voucher — Wi-Fi</title>
  <!-- Redireciona para a loja DESTE local. -->
  <meta http-equiv="refresh" content="0; url=https://reconcavo-voucher.vercel.app/?loja=principal">
  <script>window.location.replace("https://reconcavo-voucher.vercel.app/?loja=principal");</script>
  <style>
    * { box-sizing: border-box; }
    body { margin:0; font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;
           background:#0f3d2e; color:#fff; min-height:100vh;
           display:flex; align-items:center; justify-content:center; padding:16px; }
    .card { background:#fff; color:#0f172a; border-radius:16px; padding:24px; width:100%;
            max-width:360px; box-shadow:0 10px 40px rgba(0,0,0,.25); }
    .brand { display:flex; align-items:center; gap:10px; margin-bottom:10px; }
    .brand .dot { width:40px; height:40px; display:flex; align-items:center; justify-content:center; }
    .brand .dot img { width:100%; height:100%; object-fit:contain; }
    h1 { font-size:18px; margin:0; }
    p.sub { color:#64748b; font-size:13px; margin:2px 0 16px; }
    .buy { display:block; text-align:center; text-decoration:none; background:#16a34a; color:#fff;
           font-weight:700; padding:14px; border-radius:12px; font-size:16px; }
    .divider { text-align:center; color:#94a3b8; font-size:12px; margin:16px 0; }
    label { font-size:12px; color:#475569; display:block; margin-bottom:6px; }
    input { width:100%; padding:12px; border:1px solid #cbd5e1; border-radius:10px; font-size:16px;
            text-transform:uppercase; letter-spacing:1px; }
    button { width:100%; margin-top:12px; padding:13px; border:0; border-radius:10px;
             background:#0f3d2e; color:#fff; font-weight:700; font-size:16px; }
    .err { background:#fef2f2; color:#b91c1c; border:1px solid #fecaca; padding:10px;
           border-radius:10px; font-size:13px; margin-bottom:14px; }
  </style>
</head>
<body>
  <!-- Só aparece se o redirecionamento não acontecer (site fora do ar / captive
       browser sem JS). Ainda permite comprar e conectar. -->
  <div class="card">
    <div class="brand">
      <div class="dot"><img src="https://reconcavo-voucher.vercel.app/logo.png" alt="RV"></div>
      <div>
        <h1>Recôncavo Voucher</h1>
        <p class="sub" style="margin:0">Wi-Fi rápido por hora, dia ou mês</p>
      </div>
    </div>

    $(if error)<div class="err">$(error)</div>$(endif)

    <a class="buy" href="https://reconcavo-voucher.vercel.app/?loja=principal">Abrir site e comprar</a>

    <div class="divider">— já tenho um código —</div>

    <form name="login" action="$(link-login-only)" method="post"
          onsubmit="document.login.password.value=document.login.username.value">
      <input type="hidden" name="dst" value="$(link-orig)">
      <input type="hidden" name="popup" value="true">
      <input type="hidden" name="password" value="">
      <label for="username">Código do voucher</label>
      <input id="username" name="username" placeholder="REC-XXXX" autocapitalize="characters" autocomplete="off" required>
      <button type="submit">Conectar</button>
    </form>
  </div>
</body>
</html>
